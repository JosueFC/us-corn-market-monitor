name: ci
on: [push, pull_request]

jobs:
  test:
    # Windows is in the matrix because the pipeline is developed and run from PowerShell.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests (ingestion fixtures and dbt models on synthetic data, including deliberately broken data)
        run: python -m pytest
      - name: dbt build on a fresh synthetic database (models, seeds and data tests)
        run: |
          python -m scripts.make_sample_data
          dbt build --project-dir dbt --profiles-dir dbt
        env:
          CORN_DB: data/sample.duckdb
          DBT_SEND_ANONYMOUS_USAGE_STATS: "False"
