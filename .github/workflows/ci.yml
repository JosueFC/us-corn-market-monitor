name: ci
on: [push, pull_request]

jobs:
  test:
    # Windows is in the matrix because the pipeline is developed and run from PowerShell.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Ingestion tests (synthetic fixtures, including deliberately broken ones; no network)
        run: python -m pytest
